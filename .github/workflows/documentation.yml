name: baskerville-tf Docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python3 -m pip install '.[docs]'

      - name: Sphinx build
        run: |
          cd src/docs/source
          rm -f *.rst make.bat
          cd ../..
          sphinx-apidoc -F -a -H baskerville-tf -o docs/source baskerville
          cd docs
          make html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: src/docs/build/html
          force_orphan: true
